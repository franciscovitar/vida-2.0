name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/professional-growth-frontier-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format final Professional files
        run: |
          npx prettier --write \
            components/professional/ProfessionalDashboard.tsx \
            tests/professional-intelligence.test.ts

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify

      - name: Restore normal workflow and persist formatted bytes
        run: |
          cat > .github/workflows/quality.yml <<'EOF'
          name: Quality

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: quality-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Test project
                  run: npm test

                - name: Verify project
                  run: npm run verify
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/quality.yml \
            components/professional/ProfessionalDashboard.tsx \
            tests/professional-intelligence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Prettier to professional growth [skip ci]"
            git push origin HEAD:feat/professional-growth-frontier-v1
          fi
