name: Quality

on:
  pull_request:
    paths-ignore:
      - 'data/generated/world/**'
  push:
    branches: [main]
    paths-ignore:
      - 'data/generated/world/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary canonical formatter capture
        run: |
          npx prettier --write 'components/gym/GymDashboard.tsx' 'components/gym/GymSummaryOverview.tsx' 'components/planning/DailyOrientationPanels.tsx' 'components/planning/PlanningWorkspaceV2.tsx' 'lib/daily-planning/minimal-orientation-candidate.ts' 'lib/daily-planning/orientation-v2.ts' 'tests/append-cells-v2.test.ts' 'tests/daily-orientation-v2.test.ts' 'tests/minimal-orientation-candidate.test.ts'
          for path in 'components/gym/GymDashboard.tsx' 'components/gym/GymSummaryOverview.tsx' 'components/planning/DailyOrientationPanels.tsx' 'components/planning/PlanningWorkspaceV2.tsx' 'lib/daily-planning/minimal-orientation-candidate.ts' 'lib/daily-planning/orientation-v2.ts' 'tests/append-cells-v2.test.ts' 'tests/daily-orientation-v2.test.ts' 'tests/minimal-orientation-candidate.test.ts'; do
            printf 'FORMATTED_BEGIN:%s:' "$path"
            base64 -w0 "$path"
            printf '\n'
          done

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify
