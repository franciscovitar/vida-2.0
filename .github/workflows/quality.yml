name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Emit canonical Prettier output for Planificacion files
        run: |
          npx prettier --write app/actions/tasks.ts components/planning/PlanningWorkspace.tsx components/planning/TaskManager.module.scss components/planning/TaskManager.tsx lib/planning/overview.ts lib/tasks/web-crud-core.ts tests/task-web-crud.test.ts types/planning.ts
          for f in app/actions/tasks.ts components/planning/PlanningWorkspace.tsx components/planning/TaskManager.module.scss components/planning/TaskManager.tsx lib/planning/overview.ts lib/tasks/web-crud-core.ts tests/task-web-crud.test.ts types/planning.ts; do
            echo "__FORMAT_FILE__:$f"
            base64 -w0 "$f"
            echo
          done
          exit 1

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify
