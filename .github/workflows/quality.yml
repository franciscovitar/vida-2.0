name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/professional-growth-frontier-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format exact Professional files for artifact
        run: |
          npx prettier --write \
            data/generated/professional-snapshot.json \
            docs/professional-intelligence.md \
            lib/professional/contract.ts \
            README.md \
            tests/professional-intelligence.test.ts \
            types/professional-intelligence.ts

      - name: Upload formatted Professional files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-professional
          path: |
            data/generated/professional-snapshot.json
            docs/professional-intelligence.md
            lib/professional/contract.ts
            README.md
            tests/professional-intelligence.test.ts
            types/professional-intelligence.ts
          if-no-files-found: error

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify

      - name: Commit formatted Professional files
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/professional-growth-frontier-v1')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/professional-snapshot.json \
            docs/professional-intelligence.md \
            lib/professional/contract.ts \
            README.md \
            tests/professional-intelligence.test.ts \
            types/professional-intelligence.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Prettier to professional growth block"
            git push origin HEAD:feat/professional-growth-frontier-v1
          fi
