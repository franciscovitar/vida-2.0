name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Professional handoff files once
        run: |
          npx prettier --write \
            docs/professional-intelligence.md \
            tests/professional-intelligence.test.ts \
            types/professional-intelligence.ts

      - name: Restore normal Quality workflow
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml

      - name: Persist formatter output
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/quality.yml \
            docs/professional-intelligence.md \
            tests/professional-intelligence.test.ts \
            types/professional-intelligence.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Prettier to adaptive learning handoff"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify
