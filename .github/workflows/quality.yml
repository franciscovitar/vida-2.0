name: Quality

on:
  pull_request:
    paths-ignore:
      - 'data/generated/world/**'
  push:
    branches: [main]
    paths-ignore:
      - 'data/generated/world/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary one-run release-prep step. Removed before merging.
      - name: Export Prettier-formatted V4 files for release prep
        run: |
          npx prettier --write "components/gym/GymRoutineTabs.tsx" "components/gym/GymRoutineV4.tsx" "docs/gym-v2-source.md" "lib/gym/routine-v4-proposal.ts" "tests/gym-ux-navigation.test.ts"
          node -e 'const fs=require("node:fs"); for (const p of ["components/gym/GymRoutineTabs.tsx","components/gym/GymRoutineV4.tsx","docs/gym-v2-source.md","lib/gym/routine-v4-proposal.ts","tests/gym-ux-navigation.test.ts"]) console.log("V4_FORMATTED_JSON "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))'

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify
