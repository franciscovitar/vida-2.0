name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

  tmdb-attribution-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add approved TMDB credits block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''      <p className={styles.attribution}>
                  This product uses the TMDB API but is not endorsed or certified by TMDB.
                </p>'''
          new = '''      <section className={styles.attribution} aria-label="Créditos de datos e imágenes">
                  <a
                    className={styles['tmdb-logo']}
                    href="https://www.themoviedb.org"
                    target="_blank"
                    rel="noreferrer"
                    aria-label="TMDB"
                  />
                  <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
                </section>'''

          for filename in (
              'components/media/MediaDashboard.tsx',
              'components/media/MediaFocusDashboard.tsx',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected TMDB attribution markup in {filename}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          css = Path('components/media/MediaDashboard.module.scss')
          text = css.read_text(encoding='utf-8')
          old_css = '''.attribution {
            margin: 0.25rem 0 0;
            color: var(--text-subtle);
            font-size: 0.66rem;
            line-height: 1.35;
            text-align: center;
          }'''
          new_css = '''.attribution {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            align-items: center;
            margin: 0.25rem 0 0;
            padding: 0.6rem;
            color: var(--text-subtle);
            font-size: 0.66rem;
            line-height: 1.35;
            text-align: center;
          }

          .attribution p {
            margin: 0;
          }

          .tmdb-logo {
            display: block;
            width: 52px;
            height: 52px;
            background-image: url('https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
          }'''
          if text.count(old_css) != 1:
              raise SystemExit('unexpected TMDB attribution styles')
          css.write_text(text.replace(old_css, new_css), encoding='utf-8')
          PY

      - name: Format changed files
        run: npx prettier --write components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDashboard.module.scss

      - name: Commit attribution fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No attribution changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDashboard.module.scss
          git commit -m "Media: comply with TMDB attribution requirements"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
