name: Quality

on:
  pull_request:
    paths-ignore:
      - 'data/generated/world/**'
  push:
    branches: [main]
    paths-ignore:
      - 'data/generated/world/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify

  format_once_v2_protocol:
    if: github.event_name == 'pull_request' && github.head_ref == 'ai/planning-v2-dispatch-ledger-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format ONLY synthetic protocol and tests
        run: |
          npx --no-install prettier --write lib/daily-planning/dispatch-protocol-v2.ts tests/dispatch-protocol-v2.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/daily-planning/dispatch-protocol-v2.ts tests/dispatch-protocol-v2.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(planning): format synthetic dispatch protocol'
            git push origin HEAD:refs/heads/ai/planning-v2-dispatch-ledger-20261011
          fi
