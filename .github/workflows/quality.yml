name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test project
        run: npm test

      - name: Format Health Check-in files for diagnosis
        run: |
          npx prettier --write app/actions/health-checkin.ts components/health/HealthCheckinForm.tsx lib/health/checkin-google-port.ts lib/health/checkin.ts
          echo '=== CHECKIN_ACTION_FORMATTED_START ==='
          cat app/actions/health-checkin.ts
          echo '=== CHECKIN_ACTION_FORMATTED_END ==='
          echo '=== CHECKIN_FORM_FORMATTED_START ==='
          cat components/health/HealthCheckinForm.tsx
          echo '=== CHECKIN_FORM_FORMATTED_END ==='
          echo '=== CHECKIN_PORT_FORMATTED_START ==='
          cat lib/health/checkin-google-port.ts
          echo '=== CHECKIN_PORT_FORMATTED_END ==='
          echo '=== CHECKIN_CORE_FORMATTED_START ==='
          cat lib/health/checkin.ts
          echo '=== CHECKIN_CORE_FORMATTED_END ==='

      - name: Verify project
        run: npm run verify
