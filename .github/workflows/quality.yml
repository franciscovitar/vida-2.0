name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose capture formatting and tests
        run: |
          npx prettier --write docs/conversational-capture-v1.md lib/capture/contracts.ts lib/capture/direct-inbox.ts tests/conversational-inbox-direct-apply.test.ts
          git diff -- docs/conversational-capture-v1.md lib/capture/contracts.ts lib/capture/direct-inbox.ts tests/conversational-inbox-direct-apply.test.ts
          npm test
          exit 1
