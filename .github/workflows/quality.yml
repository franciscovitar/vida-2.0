name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test project
        run: npm test

      - name: Format Health Radar files for diagnosis
        run: |
          npx prettier --write components/health/HealthIntelligenceSections.tsx lib/health/deviation-radar.ts tests/health-deviation-radar.test.ts
          echo '=== SECTIONS_FORMATTED_START ==='
          cat components/health/HealthIntelligenceSections.tsx
          echo '=== SECTIONS_FORMATTED_END ==='
          echo '=== RADAR_FORMATTED_START ==='
          cat lib/health/deviation-radar.ts
          echo '=== RADAR_FORMATTED_END ==='
          echo '=== RADAR_TEST_FORMATTED_START ==='
          cat tests/health-deviation-radar.test.ts
          echo '=== RADAR_TEST_FORMATTED_END ==='

      - name: Verify project
        run: npm run verify
