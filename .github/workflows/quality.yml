name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

  media-format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Media files
        run: >-
          npx prettier --write
          components/media/MediaDashboard.tsx
          components/media/MediaFocusDashboard.tsx
          components/media/MediaPoster.tsx
          lib/media/age-feel.ts
          lib/media/parse.ts
          tests/media-country-flags.test.ts
          tests/media-focus.test.ts
          tests/media-v1.test.ts

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/media/MediaDashboard.tsx \
            components/media/MediaFocusDashboard.tsx \
            components/media/MediaPoster.tsx \
            lib/media/age-feel.ts \
            lib/media/parse.ts \
            tests/media-country-flags.test.ts \
            tests/media-focus.test.ts \
            tests/media-v1.test.ts
          git commit -m "style: format Media v2 files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
