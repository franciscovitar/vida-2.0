name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format exact Professional files for artifact
        run: |
          npx prettier --write \
            data/generated/professional-snapshot.json \
            docs/professional-intelligence.md \
            lib/professional/contract.ts \
            README.md \
            tests/professional-intelligence.test.ts \
            types/professional-intelligence.ts

      - name: Upload formatted Professional files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-professional
          path: |
            data/generated/professional-snapshot.json
            docs/professional-intelligence.md
            lib/professional/contract.ts
            README.md
            tests/professional-intelligence.test.ts
            types/professional-intelligence.ts
          if-no-files-found: error

      - name: Test project
        run: npm test

      - name: Verify project
        run: npm run verify
