name: Temp format Gym summary scope

on:
  push:
    branches:
      - tmp/gym-summary-scope-format-20261006

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/gym-summary-scope-format-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Gym summary scope
        run: npx prettier --write lib/gym/v2-analytics.ts tests/gym-summary-scope.test.ts
      - name: Commit formatting and remove temp workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/gym/v2-analytics.ts tests/gym-summary-scope.test.ts
          git rm .github/workflows/gym-summary-scope-format-temp.yml
          git commit -m "Format Gym summary scope"
          git push origin HEAD:tmp/gym-summary-scope-format-20261006
