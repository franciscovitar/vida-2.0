name: World format once

on:
  push:
    branches:
      - world-temporal-pyramid-ui-20261005
    paths:
      - .github/workflows/world-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-temporal-pyramid-ui-20261005
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format World temporal files
        run: >
          npx prettier --write
          components/world/World.module.scss
          components/world/WorldTemporal.tsx
          data/generated/world/temporal/periods/day/2026-10-05.json
          docs/world-intelligence.md
          lib/world/temporal-contract.ts
          lib/world/temporal.ts
          tests/world-intelligence.test.ts
          types/world-intelligence.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/world/World.module.scss
          git add components/world/WorldTemporal.tsx
          git add data/generated/world/temporal/periods/day/2026-10-05.json
          git add docs/world-intelligence.md
          git add lib/world/temporal-contract.ts
          git add lib/world/temporal.ts
          git add tests/world-intelligence.test.ts
          git add types/world-intelligence.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style(world): apply Prettier to temporal pyramid"
            git push origin HEAD:world-temporal-pyramid-ui-20261005
          fi
