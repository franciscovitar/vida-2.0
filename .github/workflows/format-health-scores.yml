name: Format Health Scores Preview

on:
  push:
    branches:
      - health-explainable-scores-v1-1-2026-09-18

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write \
            components/health/HealthIntelligenceSections.tsx \
            lib/health/intelligence.ts \
            lib/health/scores.ts \
            tests/health-scores.test.ts
          git diff -- \
            components/health/HealthIntelligenceSections.tsx \
            lib/health/intelligence.ts \
            lib/health/scores.ts \
            tests/health-scores.test.ts
