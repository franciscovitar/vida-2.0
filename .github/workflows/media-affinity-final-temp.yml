name: Media affinity final temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-affinity-final-temp.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify
        run: npm run verify

      - name: Remove temporary workflow after PASS
        shell: bash
        run: |
          git rm .github/workflows/media-affinity-final-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove temporary Media affinity validator'
          git push origin HEAD:feature/media-visual-ranking-v2
