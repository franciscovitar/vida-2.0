name: Temp Media Format

on:
  push:
    branches:
      - feature/media-visual-ranking-v2

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format Media visual ranking v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format Media files
        run: >-
          npx prettier --write
          components/media/MediaDashboard.tsx
          components/media/MediaFocusDashboard.tsx
          components/media/MediaPoster.tsx
          lib/media/age-feel.ts
          lib/media/parse.ts
          tests/media-country-flags.test.ts
          tests/media-focus.test.ts
          tests/media-v1.test.ts
      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaPoster.tsx lib/media/age-feel.ts lib/media/parse.ts tests/media-country-flags.test.ts tests/media-focus.test.ts tests/media-v1.test.ts
          git commit -m "chore: format Media visual ranking v2"
          git push origin HEAD:feature/media-visual-ranking-v2
