name: Temporary Gym V2 fixed baseline formatter

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gym-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format fixed baseline files
        run: >-
          npx prettier --write
          components/gym/GymV2Overview.tsx
          lib/gym/external-strength-benchmark.ts
          lib/gym/strength-benchmark-baseline.ts
          lib/gym/strength-estimation.ts
          tests/gym-external-benchmark.test.ts
          docs/gym-v2-source.md
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/gym/GymV2Overview.tsx \
            lib/gym/external-strength-benchmark.ts \
            lib/gym/strength-benchmark-baseline.ts \
            lib/gym/strength-estimation.ts \
            tests/gym-external-benchmark.test.ts \
            docs/gym-v2-source.md
          git commit -m "style(gym): format fixed benchmark baseline"
          git push origin HEAD:feat/gym-v2
