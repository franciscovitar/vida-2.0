name: Temporary FreshEvidence Format

on:
  push:
    branches:
      - study-engine/fresh-evidence-v1-20260928

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study-engine/fresh-evidence-v1-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/study-engine/fresh-evidence.ts lib/study-engine/learning-evidence-sheet.ts tests/study-engine-fresh-evidence.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/study-engine/fresh-evidence.ts lib/study-engine/learning-evidence-sheet.ts tests/study-engine-fresh-evidence.test.ts
          git commit -m "style: format Study Engine FreshEvidence bridge"
          git push
