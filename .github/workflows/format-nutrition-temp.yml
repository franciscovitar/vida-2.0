name: Temp format nutrition files

on:
  push:
    branches:
      - fix-nutrition-target-row-type-clean-20261006

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-nutrition-target-row-type-clean-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format nutrition files and remove temporary workflow
        run: |
          npx prettier --write             components/nutrition/NutritionNutrientTrends.tsx             components/nutrition/NutritionV2Overview.tsx             lib/nutrition/ai-insight-freshness.ts             lib/nutrition/dashboard.ts             lib/nutrition/history-reconciliation.ts             lib/nutrition/nutrient-summary-freshness.ts             lib/nutrition/nutrient-summary-integrity.ts             lib/nutrition/nutrient-summary-uniqueness.ts             lib/nutrition/nutrient-window-source.ts             lib/nutrition/nutrient-window.ts             lib/nutrition/target-history.ts             lib/nutrition/types.ts             tests/nutrition-v2.test.ts
          rm .github/workflows/format-nutrition-temp.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format nutrition files and remove temporary workflow"
          git push origin HEAD:fix-nutrition-target-row-type-clean-20261006
