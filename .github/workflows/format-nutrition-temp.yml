name: Temp format nutrition files

on:
  push:
    branches:
      - fix-nutrition-target-row-type-20261006

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-nutrition-target-row-type-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format nutrition files
        run: >
          npx prettier --write
          components/nutrition/NutritionNutrientTrends.tsx
          components/nutrition/NutritionV2Overview.tsx
          lib/nutrition/ai-insight-freshness.ts
          lib/nutrition/dashboard.ts
          lib/nutrition/history-reconciliation.ts
          lib/nutrition/nutrient-summary-freshness.ts
          lib/nutrition/nutrient-summary-integrity.ts
          lib/nutrition/nutrient-summary-uniqueness.ts
          lib/nutrition/nutrient-window-source.ts
          lib/nutrition/nutrient-window.ts
          lib/nutrition/target-history.ts
          lib/nutrition/types.ts
          tests/nutrition-v2.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/nutrition/NutritionNutrientTrends.tsx components/nutrition/NutritionV2Overview.tsx lib/nutrition/ai-insight-freshness.ts lib/nutrition/dashboard.ts lib/nutrition/history-reconciliation.ts lib/nutrition/nutrient-summary-freshness.ts lib/nutrition/nutrient-summary-integrity.ts lib/nutrition/nutrient-summary-uniqueness.ts lib/nutrition/nutrient-window-source.ts lib/nutrition/nutrient-window.ts lib/nutrition/target-history.ts lib/nutrition/types.ts tests/nutrition-v2.test.ts
          git commit -m "Format nutrition files"
          git push origin HEAD:fix-nutrition-target-row-type-20261006
