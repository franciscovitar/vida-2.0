name: Temporary Nutrition format

on:
  push:
    branches:
      - feat/nutrition-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Nutrition target reader
        run: npx prettier --write lib/nutrition/dashboard.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- lib/nutrition/dashboard.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/nutrition/dashboard.ts
          git commit -m "style: format Nutrition nutrient target reader"
          git push origin HEAD:feat/nutrition-v2
