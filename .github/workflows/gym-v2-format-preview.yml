name: Temporary Gym V2 format preview

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Gym V2 component
        run: npx prettier --write components/gym/GymV2Overview.tsx
      - name: Print formatted component
        run: cat components/gym/GymV2Overview.tsx
