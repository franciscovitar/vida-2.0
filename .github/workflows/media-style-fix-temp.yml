name: Media style fix temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-style-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix Media styles
        run: |
          npx stylelint components/media/MediaDashboard.module.scss --fix
          npx prettier --write components/media/MediaDashboard.module.scss
      - name: Commit and self-remove
        shell: bash
        run: |
          git rm .github/workflows/media-style-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/media/MediaDashboard.module.scss
          git commit -m 'style(media): normalize season UI rules'
          git push origin HEAD:feature/media-visual-ranking-v2
