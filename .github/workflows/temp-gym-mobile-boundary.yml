name: Temporary Gym mobile boundary repair

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: temporary gym responsive repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gym-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair Gym V2 media range syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/gym/GymV2Overview.module.scss')
          s = p.read_text()
          replacements = {
              '@media (max-width <= 1120px)': '@media (width <= 1120px)',
              '@media (max-width <= 880px)': '@media (width <= 880px)',
              '@media (max-width <= 640px)': '@media (width <= 640px)',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old!r}, got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: npx prettier --write components/gym/GymV2Overview.module.scss
      - run: npm run verify
      - name: Commit responsive repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/gym/GymV2Overview.module.scss
          git commit -m "fix(gym): apply mobile dashboard breakpoints"
          git push origin HEAD:feat/gym-v2
