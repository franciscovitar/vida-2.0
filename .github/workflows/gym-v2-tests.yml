name: Temporary Gym V2 tests

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Gym V2 Prettier diff
        run: |
          npx prettier --write components/gym/GymDashboard.tsx components/gym/GymV2Overview.tsx lib/gym/v2-analytics.ts tests/gym-v2.test.ts
          git diff --no-ext-diff --unified=3 -- components/gym/GymDashboard.tsx components/gym/GymV2Overview.tsx lib/gym/v2-analytics.ts tests/gym-v2.test.ts

      - name: Run test suite
        run: npm test
