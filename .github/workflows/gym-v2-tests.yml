name: Temporary Gym V2 tests

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Gym V2 files exactly once
        run: |
          npx prettier --write components/gym/GymDashboard.tsx components/gym/GymV2Overview.tsx lib/gym/v2-analytics.ts tests/gym-v2.test.ts
          if git diff --quiet -- components/gym/GymDashboard.tsx components/gym/GymV2Overview.tsx lib/gym/v2-analytics.ts tests/gym-v2.test.ts; then
            echo "Gym V2 files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/gym/GymDashboard.tsx components/gym/GymV2Overview.tsx lib/gym/v2-analytics.ts tests/gym-v2.test.ts
          git commit -m "style: format Gym V2 files"
          git push origin HEAD:feat/gym-v2

      - name: Run test suite
        run: npm test
