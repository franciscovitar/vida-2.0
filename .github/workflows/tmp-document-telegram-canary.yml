name: Temporary document Telegram canary flag

on:
  push:
    branches:
      - feat/telegram-inbox-direct-canary

permissions:
  contents: write

concurrency:
  group: tmp-document-telegram-canary
  cancel-in-progress: true

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/telegram-inbox-direct-canary
          fetch-depth: 1
          persist-credentials: true

      - name: Insert the disabled canary flag exactly once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.env.example')
          text = path.read_text(encoding='utf-8')
          needle = "OPENCLAW_PROPOSALS_ENABLED=false\n\n\n# Contrato canónico: disabled | read-only | full."
          replacement = """OPENCLAW_PROPOSALS_ENABLED=false

# Canary Telegram → Bandeja. Default seguro: apagado.
# Requiere además CONVERSATIONAL_INBOX_DIRECT_APPLY_ENABLED=true y WRITE_ACTIONS_ENABLED=true.
# Mantener false hasta una activación canary explícitamente autorizada.
OPENCLAW_TELEGRAM_INBOX_DIRECT_ENABLED=false

# Contrato canónico: disabled | read-only | full."""
          if text.count(needle) != 1:
              raise SystemExit('Expected exact OpenClaw insertion point not found exactly once')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Enforce docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = ".env.example"
          git diff -- .env.example | grep -F 'OPENCLAW_TELEGRAM_INBOX_DIRECT_ENABLED=false'

      - name: Commit documentation if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No documentation change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .env.example
          git commit -m "docs: document telegram inbox canary flag"
          git push origin HEAD:feat/telegram-inbox-direct-canary
