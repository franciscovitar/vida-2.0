name: Media format fix temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-format-fix-temp.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Media files
        run: |
          npx prettier --write components/media/MediaSortControl.tsx lib/media/parse.ts lib/media/season-intelligence.ts lib/media/view.ts tests/media-focus.test.ts tests/media-seasons.test.ts tests/media-v1.test.ts
      - name: Commit and self-remove
        shell: bash
        run: |
          git rm .github/workflows/media-format-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/media/MediaSortControl.tsx lib/media/parse.ts lib/media/season-intelligence.ts lib/media/view.ts tests/media-focus.test.ts tests/media-seasons.test.ts tests/media-v1.test.ts
          git commit -m 'style(media): normalize ranking and season formatting'
          git push origin HEAD:feature/media-visual-ranking-v2
