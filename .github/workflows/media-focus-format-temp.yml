name: Media focus format temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-focus-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/media-focus.test.ts
      - name: Commit and self-remove
        shell: bash
        run: |
          git rm .github/workflows/media-focus-format-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/media-focus.test.ts
          git commit -m 'style(media): format final focus tests'
          git push origin HEAD:feature/media-visual-ranking-v2
