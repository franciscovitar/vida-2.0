name: Temporary Gym previous-week patch

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gym-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mount previous-week panel in Gym V2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/gym/GymV2Overview.tsx')
          s = p.read_text()
          replacements = [
            (
              "import { SectionHeader } from '@/components/ui/SectionHeader';\n",
              "import { SectionHeader } from '@/components/ui/SectionHeader';\nimport { GymPreviousWeek } from '@/components/gym/GymPreviousWeek';\n",
            ),
            (
              "      </section>\n\n      <Card aria-labelledby=\"gym-v2-insights-title\">",
              "      </section>\n\n      <GymPreviousWeek sessions={sessions} summaries={summaries} today={today} />\n\n      <Card aria-labelledby=\"gym-v2-insights-title\">",
            ),
          ]
          for old, new in replacements:
            if s.count(old) != 1:
              raise SystemExit(f'expected one Gym overview anchor, got {s.count(old)}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: npx prettier --write components/gym/GymV2Overview.tsx components/gym/GymPreviousWeek.tsx components/gym/GymPreviousWeek.module.scss lib/gym/previous-week.ts tests/gym-previous-week.test.ts
      - run: npm test
      - name: Commit Gym previous-week panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/gym/GymV2Overview.tsx components/gym/GymPreviousWeek.tsx components/gym/GymPreviousWeek.module.scss lib/gym/previous-week.ts tests/gym-previous-week.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(gym): show previous-week training marks"
          git push origin HEAD:feat/gym-v2

# Temporary workflow: remove after PASS.
