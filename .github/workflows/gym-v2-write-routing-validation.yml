name: Temporary Gym write routing validation

on:
  push:
    branches:
      - feat/gym-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gym-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Keep Gym V2 slice formatted
        run: >-
          npx prettier --write
          components/gym/GymV2Overview.tsx
          docs/gym-v2-source.md
          lib/actions/config.ts
          lib/actions/gym-sheets.ts
          lib/gym/sheets-config.ts
          lib/gym/sheets-read.ts
          tests/gym-sheets-routing.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/gym/GymV2Overview.tsx docs/gym-v2-source.md lib/actions/config.ts lib/actions/gym-sheets.ts lib/gym/sheets-config.ts lib/gym/sheets-read.ts tests/gym-sheets-routing.test.ts
          git commit -m "format Gym write routing"
          git push origin HEAD:feat/gym-v2
