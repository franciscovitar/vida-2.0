name: Temp Media Auth Format

on:
  push:
    branches: [feature/media-visual-ranking-v2]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/google/auth.ts tests/google-auth-cache.test.ts
      - name: Commit deterministic formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- lib/google/auth.ts tests/google-auth-cache.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/google/auth.ts tests/google-auth-cache.test.ts
          git commit -m "style: format Google token cache change"
          git push origin HEAD:feature/media-visual-ranking-v2
