name: M4 Prettier Diagnostic

on:
  push:
    branches: [personal-shopping-v2-checkpoint-c-20261007]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write             components/personal-shopping/PersonalShoppingWorkspace.tsx             lib/personal-shopping/service.ts             tests/personal-shopping-service.test.ts
          git diff --             components/personal-shopping/PersonalShoppingWorkspace.tsx             lib/personal-shopping/service.ts             tests/personal-shopping-service.test.ts
