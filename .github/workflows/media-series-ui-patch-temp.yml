name: Media series UI patch temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-series-ui-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0

      - name: Apply focused UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'components/media/MediaDashboard.tsx',
              "interface MediaDashboardViewProps {\n  data: MediaDashboardData;\n}\n\nexport function MediaDashboardView({ data }: MediaDashboardViewProps) {\n  const firstReadyMedium =\n    data.sources.find((source) => source.state === 'ready')?.medium ?? 'movie';\n  const [filters, setFilters] = useState<MediaFilters>(() => initialFilters(firstReadyMedium));",
              "interface MediaDashboardViewProps {\n  data: MediaDashboardData;\n  initialMedium?: MediaKind;\n}\n\nexport function MediaDashboardView({ data, initialMedium }: MediaDashboardViewProps) {\n  const firstReadyMedium =\n    data.sources.find((source) => source.state === 'ready')?.medium ?? 'movie';\n  const [filters, setFilters] = useState<MediaFilters>(() =>\n    initialFilters(initialMedium ?? firstReadyMedium),\n  );",
          )

          p = Path('components/media/MediaFocusDashboard.tsx')
          text = p.read_text()
          old = '<MediaDashboardView data={data} />'
          if text.count(old) != 2:
              raise SystemExit(f'MediaFocusDashboard expected 2 dashboard fallbacks, got {text.count(old)}')
          p.write_text(text.replace(old, '<MediaDashboardView data={data} initialMedium={filters.medium} />'))

          for path in [
              'components/media/MediaDashboard.tsx',
              'components/media/MediaFocusDashboard.tsx',
              'components/media/MediaDetailDialog.tsx',
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace('impacto cultural', 'presencia cultural')
              text = text.replace('Impacto cultural', 'Presencia cultural')
              text = text.replace('Impacto <strong>', 'Presencia cultural <strong>')
              p.write_text(text)

          replace_once(
              'components/media/MediaDashboard.tsx',
              "import { watchPriorityScore } from '@/lib/media/focus';",
              "import { watchPriorityScore } from '@/lib/media/focus';\nimport { nextSeasonFor, seasonWatchPriorityScore } from '@/lib/media/seasons';",
          )
          replace_once(
              'components/media/MediaFocusDashboard.tsx',
              "import { deriveMediaFilterOptions, filterMediaTitles, sortMediaTitles } from '@/lib/media/view';",
              "import { nextSeasonFor, seasonWatchPriorityScore } from '@/lib/media/seasons';\nimport { deriveMediaFilterOptions, filterMediaTitles, sortMediaTitles } from '@/lib/media/view';",
          )

          anchor = "                  <div className={styles['primary-scores']}>"
          block = """                  {item.medium === 'series' && item.nextSeasonNumber !== null ? (\n                    <div className={styles['next-season-callout']}>\n                      <span>Siguiente</span>\n                      <strong>Temporada {item.nextSeasonNumber}</strong>\n                      {seasonWatchPriorityScore(nextSeasonFor(item)) !== null ? (\n                        <small>Prioridad {score(seasonWatchPriorityScore(nextSeasonFor(item)))}</small>\n                      ) : null}\n                    </div>\n                  ) : null}\n\n""" + anchor
          for path in ['components/media/MediaDashboard.tsx', 'components/media/MediaFocusDashboard.tsx']:
              replace_once(path, anchor, block)

          replace_once(
              'components/media/MediaDetailDialog.tsx',
              "import { watchPriorityScore } from '@/lib/media/focus';",
              "import { watchPriorityScore } from '@/lib/media/focus';\nimport { seasonWatchPriorityScore } from '@/lib/media/seasons';",
          )

          season_block = """            {item.medium === 'series' && item.seasonDetails.length > 0 ? (\n              <section className={styles['season-section']} aria-label=\"Temporadas\">\n                <div className={styles['season-heading']}>\n                  <div>\n                    <h3>Temporadas</h3>\n                    <p>Las notas de la serie completa son propias; no son un promedio de las temporadas.</p>\n                  </div>\n                  {item.nextSeasonNumber !== null ? (\n                    <Badge domain=\"projects\">Siguiente · T{item.nextSeasonNumber}</Badge>\n                  ) : null}\n                </div>\n                <div className={styles['season-grid']}>\n                  {item.seasonDetails.map((season) => {\n                    const seasonPriority = seasonWatchPriorityScore(season);\n                    return (\n                      <article\n                        key={season.seasonNumber}\n                        className={styles['season-card']}\n                        data-next={season.seasonNumber === item.nextSeasonNumber}\n                      >\n                        <div className={styles['season-card-heading']}>\n                          <strong>Temporada {season.seasonNumber}</strong>\n                          <span>\n                            {season.year ?? 'Año sin confirmar'}\n                            {season.episodeCount !== null ? ` · ${season.episodeCount} ep.` : ''}\n                          </span>\n                        </div>\n                        <div className={styles['season-score-grid']}>\n                          <span>Afinidad para mí <strong>{score(season.estimatedAffinity)}</strong></span>\n                          <span>Prioridad <strong>{score(seasonPriority)}</strong></span>\n                          <span>Cinéfilo <strong>{score(season.cinephileValue)}</strong></span>\n                          <span>Presencia cultural <strong>{score(season.culturalPresence)}</strong></span>\n                        </div>\n                        {season.observedRating !== null ? (\n                          <div className={styles['season-observed']}>\n                            <span>Mi nota</span>\n                            <strong>{score(season.observedRating)}</strong>\n                          </div>\n                        ) : null}\n                        {season.evidenceState !== 'ready' ? (\n                          <small className={styles['season-evidence']}>\n                            {season.evidenceState === 'partial'\n                              ? 'Evidencia parcial: lo desconocido no se fuerza a una nota.'\n                              : 'Sin evidencia suficiente para completar todas las notas.'}\n                          </small>\n                        ) : null}\n                      </article>\n                    );\n                  })}\n                </div>\n              </section>\n            ) : null}\n\n"""
          replace_once(
              'components/media/MediaDetailDialog.tsx',
              "            {item.spoilerFreeSummary ? (",
              season_block + "            {item.spoilerFreeSummary ? (",
          )

          p = Path('components/media/MediaDashboard.module.scss')
          text = p.read_text()
          marker = ".primary-scores {\n"
          if text.count(marker) != 1:
              raise SystemExit('primary-scores marker mismatch')
          styles = """.next-season-callout {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  gap: 0.45rem;\n  align-items: baseline;\n  min-height: 42px;\n  padding: 0.52rem 0.6rem;\n  color: var(--text-muted);\n  background: var(--surface-2);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-sm);\n}\n\n.next-season-callout span,\n.next-season-callout small {\n  color: var(--text-subtle);\n  font-size: 0.68rem;\n}\n\n.next-season-callout strong {\n  color: var(--text);\n  font-size: 0.82rem;\n}\n\n.next-season-callout small {\n  font-variant-numeric: tabular-nums;\n}\n\n"""
          text = text.replace(marker, styles + marker, 1)
          marker = ".detail-description {\n"
          if text.count(marker) != 1:
              raise SystemExit('detail-description marker mismatch')
          season_styles = """.season-section {\n  display: flex;\n  flex-direction: column;\n  gap: 0.65rem;\n  padding-top: 0.25rem;\n}\n\n.season-heading {\n  display: flex;\n  gap: 0.75rem;\n  align-items: flex-start;\n  justify-content: space-between;\n}\n\n.season-heading h3 {\n  margin: 0;\n  color: var(--text);\n  font-size: 0.95rem;\n}\n\n.season-heading p {\n  margin: 0.2rem 0 0;\n  color: var(--text-muted);\n  font-size: 0.72rem;\n  line-height: 1.4;\n}\n\n.season-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 0.55rem;\n}\n\n.season-card {\n  display: flex;\n  flex-direction: column;\n  gap: 0.5rem;\n  padding: 0.65rem;\n  background: var(--surface-2);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n}\n\n.season-card[data-next='true'] {\n  border-color: var(--accent);\n  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);\n}\n\n.season-card-heading {\n  display: flex;\n  gap: 0.6rem;\n  align-items: baseline;\n  justify-content: space-between;\n}\n\n.season-card-heading strong { color: var(--text); font-size: 0.82rem; }\n.season-card-heading span { color: var(--text-subtle); font-size: 0.68rem; }\n\n.season-score-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 0.35rem;\n}\n\n.season-score-grid span {\n  display: flex;\n  flex-direction: column;\n  gap: 0.12rem;\n  min-width: 0;\n  padding: 0.42rem 0.48rem;\n  color: var(--text-muted);\n  font-size: 0.65rem;\n  background: var(--surface);\n  border-radius: var(--radius-sm);\n}\n\n.season-score-grid strong,\n.season-observed strong { color: var(--text); font-variant-numeric: tabular-nums; }\n\n.season-observed {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0.4rem 0.5rem;\n  color: var(--text-muted);\n  font-size: 0.68rem;\n  background: var(--c-learning-soft);\n  border: 1px solid var(--c-learning-border);\n  border-radius: var(--radius-sm);\n}\n\n.season-evidence { color: var(--text-subtle); font-size: 0.64rem; line-height: 1.35; }\n\n"""
          p.write_text(text.replace(marker, season_styles + marker, 1))
          PY

      - name: Format changed UI files
        run: npx prettier --write components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDetailDialog.tsx components/media/MediaDashboard.module.scss

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/media-series-ui-patch-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+franciscovitar@users.noreply.github.com'
          git add components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDetailDialog.tsx components/media/MediaDashboard.module.scss
          git commit -m 'media: add series season UI and preserve bank medium'
          git push origin HEAD:feature/media-visual-ranking-v2
