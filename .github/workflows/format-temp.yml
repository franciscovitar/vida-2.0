name: Temporary format

on:
  push:
    branches:
      - feat/gym-cardio-review-ranks

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gym-cardio-review-ranks
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: >-
          npx prettier --write
          components/domain/MonthlyReviewCard.tsx
          components/gym/GymExternalBenchmark.module.scss
          components/gym/GymV2Overview.tsx
          components/gym/GymWeeklyCardio.module.scss
          components/gym/GymWeeklyCardio.tsx
          lib/gym/cardio-weekly.ts
          lib/gym/external-strength-benchmark.ts
          lib/gym/sheets-cardio-port.ts
          tests/gym-cardio-weekly.test.ts
          docs/gym-v2-source.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/domain/MonthlyReviewCard.tsx \
            components/gym/GymExternalBenchmark.module.scss \
            components/gym/GymV2Overview.tsx \
            components/gym/GymWeeklyCardio.module.scss \
            components/gym/GymWeeklyCardio.tsx \
            lib/gym/cardio-weekly.ts \
            lib/gym/external-strength-benchmark.ts \
            lib/gym/sheets-cardio-port.ts \
            tests/gym-cardio-weekly.test.ts \
            docs/gym-v2-source.md
          git commit -m "style: format gym cardio changes"
          git push origin HEAD:feat/gym-cardio-review-ranks
