name: Prettier Dump

on:
  push:
    branches:
      - nutrition-point-estimates-history-20260915

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier lib/nutrition/approximate-day-macros.ts
