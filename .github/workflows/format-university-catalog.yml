name: Temporary University Catalog Format

on:
  push:
    branches:
      - study-engine/university-catalog-v1-20260927

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study-engine/university-catalog-v1-20260927
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/(app)/aprendizaje/estudio/page.tsx" components/study-engine/StudyCatalog.tsx lib/study-engine/catalog-source.ts lib/study-engine/catalog.ts types/study-catalog.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/(app)/aprendizaje/estudio/page.tsx" components/study-engine/StudyCatalog.tsx lib/study-engine/catalog-source.ts lib/study-engine/catalog.ts types/study-catalog.ts
          git commit -m "style: format university Study Engine catalog"
          git push
