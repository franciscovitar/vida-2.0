name: B5 Delivery Validation

on:
  push:
    branches:
      - feature/controlled-automations-v1
    paths:
      - .github/workflows/b5-format-hotfix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b5-format-hotfix.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/controlled-automations-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Static checks and build
        run: npm run verify

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
