name: B5 Format Hotfix

on:
  push:
    branches:
      - feature/controlled-automations-v1
    paths:
      - .github/workflows/b5-format-hotfix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b5-format-hotfix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/controlled-automations-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore checkpoint from current main baseline
        run: git checkout origin/main -- docs/WORK-CHECKPOINT.md

      - name: Format scoped Block 5 files
        run: npx prettier --write automations/n8n/manual-ingress.json docs/WORK-CHECKPOINT.md tests/block5-automation-delivery-claim.test.ts

      - name: Verify scoped diff
        run: git diff --check

      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automations/n8n/manual-ingress.json docs/WORK-CHECKPOINT.md tests/block5-automation-delivery-claim.test.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format Block 5 delivery claim changes'
          git push origin HEAD:feature/controlled-automations-v1
