name: Media format once

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Prettier output
        run: npx prettier --write lib/media/season-intelligence.ts

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/media-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/media/season-intelligence.ts .github/workflows/media-format-once.yml
          git commit -m "style: apply canonical media formatting"
          git push origin HEAD:feature/media-visual-ranking-v2
