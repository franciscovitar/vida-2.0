name: Rhythm Sheets Format Helper

on:
  push:
    branches:
      - health-rhythm-readonly-drive-preview-2026-09-19

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Rhythm Sheets files
        run: npx prettier --write docs/health-rhythm-v1.md lib/health/rhythm-features-sheet.ts tests/health-rhythm-features-sheet.test.ts
      - name: Emit formatted files
        shell: bash
        run: |
          echo "===DOC_B64==="
          base64 -w0 docs/health-rhythm-v1.md
          echo
          echo "===SOURCE_B64==="
          base64 -w0 lib/health/rhythm-features-sheet.ts
          echo
          echo "===TEST_B64==="
          base64 -w0 tests/health-rhythm-features-sheet.test.ts
          echo
          echo "===END_FORMATTED_FILES==="
