name: Media UI refine temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-ui-refine-temp.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply scoped Media UI refinement
        run: python scripts/_temp_media_ui_refine.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write components/media/MediaDetailDialog.tsx components/media/MediaPoster.tsx components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDashboard.module.scss

      - name: Test
        run: npm test

      - name: Verify
        run: npm run verify

      - name: Commit validated refinement and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/media-ui-refine-temp.yml scripts/_temp_media_ui_refine.py
          git add components/media/MediaDetailDialog.tsx components/media/MediaPoster.tsx components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDashboard.module.scss
          git commit -m "refine media catalog cards and detail view"
          git push origin HEAD:feature/media-visual-ranking-v2
