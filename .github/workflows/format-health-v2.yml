name: Temporary Health V2 formatter

on:
  push:
    branches:
      - feat/health-v2

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/health-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format allowlisted files
        run: npx prettier --write "app/(app)/salud/page.tsx" "lib/adapters/salud-period.ts"

      - name: Guard changed paths
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(app/\(app\)/salud/page\.tsx|lib/adapters/salud-period\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatted paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run test suite on formatted tree
        run: npm test

      - name: Commit formatter output
        shell: bash
        run: |
          git add "app/(app)/salud/page.tsx" "lib/adapters/salud-period.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Health V2"
          git push origin HEAD:feat/health-v2
