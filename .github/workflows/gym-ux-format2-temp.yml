name: Temp format Gym UX 2

on:
  push:
    branches:
      - tmp/gym-ux-format2-20261006

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/gym-ux-format2-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Gym UX secondary hierarchy
        run: >
          npx prettier --write
          components/domain/MonthlyReviewCard.module.scss
          components/domain/MonthlyReviewCard.tsx
          components/gym/GymDashboard.module.scss
          components/gym/GymV2Overview.module.scss
          components/gym/GymV2Overview.tsx
          tests/gym-ux-navigation.test.ts
      - name: Commit formatting and remove temp workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/domain/MonthlyReviewCard.module.scss components/domain/MonthlyReviewCard.tsx components/gym/GymDashboard.module.scss components/gym/GymV2Overview.module.scss components/gym/GymV2Overview.tsx tests/gym-ux-navigation.test.ts
          git rm .github/workflows/gym-ux-format2-temp.yml
          git commit -m "Format Gym UX secondary hierarchy"
          git push origin HEAD:tmp/gym-ux-format2-20261006
