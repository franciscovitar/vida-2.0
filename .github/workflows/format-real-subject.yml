name: Temporary Real Subject Format

on:
  push:
    branches:
      - study-engine/real-subject-session-v1-20260928

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study-engine/real-subject-session-v1-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >
          npx prettier --write
          "app/(app)/aprendizaje/estudio/[subjectId]/page.tsx"
          docs/study-engine-university-catalog.md
          lib/study-engine/subject-items-source.ts
          tests/study-engine-attempt-store.test.ts
          tests/study-engine-catalog.test.ts
      - name: Commit formatter output and remove helper
        run: |
          git rm .github/workflows/format-real-subject.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format real subject Study Engine session"
          git push
