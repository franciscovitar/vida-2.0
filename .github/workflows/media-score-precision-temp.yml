name: Media score precision temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-score-precision-temp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch score display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          dashboard = 'components/media/MediaDashboard.tsx'
          once(
              dashboard,
              "import { watchPriorityScore } from '@/lib/media/focus';",
              "import { watchPriorityScore } from '@/lib/media/focus';\nimport { formatExternalMediaScore } from '@/lib/media/score-format';",
          )

          focus = 'components/media/MediaFocusDashboard.tsx'
          once(
              focus,
              "} from '@/lib/media/focus';",
              "} from '@/lib/media/focus';\nimport { formatExternalMediaScore } from '@/lib/media/score-format';",
          )

          for path in [dashboard, focus]:
              once(
                  path,
                  'Cinéfilo <strong>{score(item.cinephileValue)}</strong>',
                  'Cinéfilo <strong>{formatExternalMediaScore(item.cinephileValue, item.scoreVersion)}</strong>',
              )
              once(
                  path,
                  'Presencia cultural <strong>{score(item.culturalImpact)}</strong>',
                  'Presencia cultural <strong>{formatExternalMediaScore(item.culturalImpact, item.scoreVersion)}</strong>',
              )

          p = Path(dashboard)
          text = p.read_text().replace(
              '30% valor cinéfilo + 20% impacto\n            cultural.',
              '30% valor cinéfilo + 20% presencia\n            cultural.',
          )
          p.write_text(text)

          path = 'components/media/MediaDetailDialog.tsx'
          once(
              path,
              "import { watchPriorityScore } from '@/lib/media/focus';",
              "import { watchPriorityScore } from '@/lib/media/focus';\nimport { formatExternalMediaScore } from '@/lib/media/score-format';",
          )
          once(
              path,
              'Valor cinéfilo <strong>{score(item.cinephileValue)}</strong>',
              'Valor cinéfilo <strong>{formatExternalMediaScore(item.cinephileValue, item.scoreVersion)}</strong>',
          )
          once(
              path,
              'Presencia cultural <strong>{score(item.culturalImpact)}</strong>',
              'Presencia cultural <strong>{formatExternalMediaScore(item.culturalImpact, item.scoreVersion)}</strong>',
          )
          once(
              path,
              'Cinéfilo <strong>{score(season.cinephileValue)}</strong>',
              'Cinéfilo <strong>{formatExternalMediaScore(season.cinephileValue, season.scoreVersion)}</strong>',
          )
          once(
              path,
              'Presencia cultural <strong>{score(season.culturalPresence)}</strong>',
              'Presencia cultural <strong>{formatExternalMediaScore(season.culturalPresence, season.scoreVersion)}</strong>',
          )
          PY
      - run: npx prettier --write components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDetailDialog.tsx lib/media/parse.ts types/media.ts lib/media/score-format.ts tests/media-season-intelligence.test.ts
      - name: Commit and self-remove
        shell: bash
        run: |
          git rm .github/workflows/media-score-precision-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/media/MediaDashboard.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDetailDialog.tsx lib/media/parse.ts types/media.ts lib/media/score-format.ts tests/media-season-intelligence.test.ts
          git commit -m 'media: show external scores at evidence-backed precision'
          git push origin HEAD:feature/media-visual-ranking-v2
