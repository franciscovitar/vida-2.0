name: Media card refine temp

on:
  push:
    branches:
      - feature/media-visual-ranking-v2
    paths:
      - .github/workflows/media-card-refine-temp.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-visual-ranking-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply final Media catalog refinement
        run: python scripts/media-card-refine-temp.py

      - name: Install dependencies
        run: npm ci

      - name: Format touched files
        run: npx prettier --write components/media/MediaPoster.tsx components/media/ManualFocusControl.tsx components/media/MediaSortControl.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDashboard.tsx components/media/MediaDashboard.module.scss

      - name: Test
        run: npm test

      - name: Verify
        run: npm run verify

      - name: Commit validated refinement and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/media-card-refine-temp.yml scripts/media-card-refine-temp.py
          git add components/media/MediaPoster.tsx components/media/ManualFocusControl.tsx components/media/MediaSortControl.tsx components/media/MediaFocusDashboard.tsx components/media/MediaDashboard.tsx components/media/MediaDashboard.module.scss .github/workflows/media-card-refine-temp.yml scripts/media-card-refine-temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refine media cards and sorting controls'
          git push origin HEAD:feature/media-visual-ranking-v2
