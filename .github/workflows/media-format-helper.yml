name: Media format helper

on:
  push:
    branches: [feature/media-v1-dashboard]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore(media): apply prettier output') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-v1-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Media files
        run: >-
          npx prettier --write
          components/media/MediaDashboard.tsx
          lib/media/parse.ts
          lib/media/sheets-read.ts
          lib/media/view.ts
          tests/media-v1.test.ts
      - name: Run Media tests
        run: npm test
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            components/media/MediaDashboard.tsx \
            lib/media/parse.ts \
            lib/media/sheets-read.ts \
            lib/media/view.ts \
            tests/media-v1.test.ts; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            components/media/MediaDashboard.tsx \
            lib/media/parse.ts \
            lib/media/sheets-read.ts \
            lib/media/view.ts \
            tests/media-v1.test.ts
          git commit -m "chore(media): apply prettier output"
          git push origin HEAD:feature/media-v1-dashboard
