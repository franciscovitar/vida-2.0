name: Temporary format Telegram canary

on:
  push:
    branches:
      - feat/telegram-inbox-direct-canary

permissions:
  contents: write

concurrency:
  group: tmp-format-telegram-canary
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/telegram-inbox-direct-canary
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Format only the known failing files
        run: |
          npx --no-install prettier --write \
            lib/capture/direct-inbox.ts \
            lib/openclaw/direct-inbox.ts \
            openclaw-plugin/vida-2-0-api/src/adapter/plugin.integration.test.ts \
            openclaw-plugin/vida-2-0-api/src/agents.ts \
            openclaw-plugin/vida-2-0-api/src/types.ts \
            tests/openclaw-plugin-adapter-metadata.test.ts \
            tests/openclaw-telegram-inbox-direct.test.ts \
            tests/telegram-direct-context.test.ts

      - name: Enforce formatting-only allowlist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              lib/capture/direct-inbox.ts|lib/openclaw/direct-inbox.ts|openclaw-plugin/vida-2-0-api/src/adapter/plugin.integration.test.ts|openclaw-plugin/vida-2-0-api/src/agents.ts|openclaw-plugin/vida-2-0-api/src/types.ts|tests/openclaw-plugin-adapter-metadata.test.ts|tests/openclaw-telegram-inbox-direct.test.ts|tests/telegram-direct-context.test.ts)
                ;;
              '')
                ;;
              *)
                echo "Unexpected formatted path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/capture/direct-inbox.ts \
            lib/openclaw/direct-inbox.ts \
            openclaw-plugin/vida-2-0-api/src/adapter/plugin.integration.test.ts \
            openclaw-plugin/vida-2-0-api/src/agents.ts \
            openclaw-plugin/vida-2-0-api/src/types.ts \
            tests/openclaw-plugin-adapter-metadata.test.ts \
            tests/openclaw-telegram-inbox-direct.test.ts \
            tests/telegram-direct-context.test.ts
          git commit -m "style: format telegram inbox canary"
          git push origin HEAD:feat/telegram-inbox-direct-canary
