name: Temporary format assessment progress

on:
  push:
    branches:
      - feature/assessment-progress-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format assessment progress files
        run: >-
          npx prettier --write
          components/areas/AreaDashboard.tsx
          lib/areas/compose.ts
          lib/areas/load.ts
          lib/assessment-progress/snapshot.ts
          lib/daily-planning/context.ts
          types/areas.ts
          types/assessment-progress.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- \
            components/areas/AreaDashboard.tsx \
            lib/areas/compose.ts \
            lib/areas/load.ts \
            lib/assessment-progress/snapshot.ts \
            lib/daily-planning/context.ts \
            types/areas.ts \
            types/assessment-progress.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/areas/AreaDashboard.tsx \
            lib/areas/compose.ts \
            lib/areas/load.ts \
            lib/assessment-progress/snapshot.ts \
            lib/daily-planning/context.ts \
            types/areas.ts \
            types/assessment-progress.ts
          git commit -m "Format assessment progress implementation"
          git push origin HEAD:"$GITHUB_REF_NAME"
