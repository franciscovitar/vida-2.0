openapi: 3.1.0
info:
  title: Vida 2.0 OpenClaw API
  version: v1
  description: >
    API server-to-server para OpenClaw. HMAC-SHA256. Desactivada por defecto.
    Sin secretos ni valores reales en este documento.
servers:
  - url: /api/openclaw/v1
security:
  - VidaHmac: []
paths:
  /health:
    get:
      operationId: health
      summary: Health sin consultar fuentes externas
      responses:
        '200':
          description: OK
        '401':
          description: Auth fallida
        '404':
          description: API desactivada
  /capabilities:
    get:
      operationId: capabilities
      summary: Catálogo de operaciones
      responses:
        '200':
          description: OK
        '401':
          description: Auth fallida
        '404':
          description: API desactivada
  /read:
    post:
      operationId: read
      summary: Lectura tipada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, input]
              properties:
                operation:
                  type: string
                  enum:
                    - system.overview
                    - areas.list
                    - areas.get
                    - tasks.list
                    - projects.list
                    - calendar.upcoming
                    - gym.summary
                    - approvals.list
                    - documents.search
                    - document.get
                input:
                  type: object
      responses:
        '200':
          description: OK
        '400':
          description: Input u operación inválida
        '401':
          description: Auth fallida
        '403':
          description: Forbidden / flag
        '404':
          description: API desactivada o recurso
  /proposals:
    post:
      operationId: proposalsForbidden
      deprecated: true
      summary: Bloqueada durante el modo read-only
      description: >
        La ruta existe únicamente para rechazar de forma explícita clientes antiguos.
        No analiza propuestas ni construye el runtime de escrituras.
      responses:
        '401':
          description: Auth HMAC fallida
        '403':
          description: Operación bloqueada en modo read-only
        '404':
          description: API desactivada o configuración cerrada
  /proposals/{key}:
    get:
      operationId: proposalLookupForbidden
      deprecated: true
      summary: Bloqueada durante el modo read-only
      description: >
        La ruta no consulta el repositorio de propuestas ni revela si una clave existe.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '401':
          description: Auth HMAC fallida
        '403':
          description: Operación bloqueada en modo read-only
        '404':
          description: API desactivada o configuración cerrada
components:
  securitySchemes:
    VidaHmac:
      type: apiKey
      in: header
      name: X-Vida-Signature
      description: >
        Requiere además X-Vida-Key-Id, X-Vida-Timestamp y X-Vida-Request-Id.
        Firma = HMAC-SHA256(secret, timestamp + LF + METHOD + LF + pathname + LF + sha256(body)).
